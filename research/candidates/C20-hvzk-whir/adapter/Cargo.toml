[package]
name = "pqtc-c20-hvzk-whir-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
p3-baby-bear = { path = "../baby-bear" }
p3-challenger = { path = "../challenger" }
p3-commit = { path = "../commit" }
p3-dft = { path = "../dft" }
p3-field = { path = "../field" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-multilinear-util = { path = "../multilinear-util" }
p3-symmetric = { path = "../symmetric" }
p3-whir = { path = "../whir", features = ["parallel"] }
libc = "0.2"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = { version = "0.10.1", features = ["std", "std_rng", "sys_rng"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[workspace]
