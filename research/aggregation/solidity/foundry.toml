[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../../../lib"]
remappings = ["forge-std/=../../../lib/forge-std/src/"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
gas_limit = 1000000000
fs_permissions = [{ access = "write", path = "../outputs" }]
