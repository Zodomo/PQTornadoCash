[package]
name = "pqtc-r2-backend"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
uni-api-barrier = []
multi-api-barrier = []

[dependencies]
pqtc-poseidon-air = { path = "../../../../crates/pqtc-poseidon-air" }
pqtc-spec = { path = "../../../../crates/pqtc-spec" }
p3-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-multi-stark = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-multilinear-util = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-sumcheck = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-whir = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c", features = ["parallel"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = { version = "0.10.1", features = ["std", "std_rng", "sys_rng"] }
serde_json = "1.0.150"

[[bin]]
name = "h0-control"
path = "src/main.rs"

[[bin]]
name = "hiding-repair"
path = "src/hiding_repair.rs"

[[bin]]
name = "uni-api-barrier"
path = "src/uni_api_barrier.rs"
required-features = ["uni-api-barrier"]

[[bin]]
name = "multi-api-barrier"
path = "src/multi_api_barrier.rs"
required-features = ["multi-api-barrier"]
